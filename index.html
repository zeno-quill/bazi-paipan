<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<meta name="description" content="八字排盘 · 四柱推命工具:公历农历互转、四柱十神、五行纳音、大运流年,基于开源算法 lunar-javascript,纯本地运行。"/>
<title>八字排盘 · 四柱推命</title>
<script>
  // 首屏前确定主题，避免深色主题闪白（与 useTheme 的存储键/规则保持一致）
  (function () {
    var t = 'dark'
    try {
      var saved = localStorage.getItem('bazi-theme')
      if (saved === 'light' || saved === 'dark') t = saved
      else if (saved !== 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light'
    } catch (e) { /* 存储不可用时按系统偏好 */ }
    document.documentElement.dataset.theme = t
    document.documentElement.style.colorScheme = t
  })()
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
